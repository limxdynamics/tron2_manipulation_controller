suite: vla_servoj
description: "Single simulation repeat of the controller-safe VLA ServoJ timeline."
generators:
  - type: vlaServoJ
    id_prefix: VLA_SERVOJ_REPEAT
    count: 1
    states_file: examples/vla_height/states_controller_safe.txt
    preserve_timestamps: true
    send_rate_hz: 300.0
    warmup_duration_sec: 1.5
    filter_ratio: 1.0
    max_joint_step_rad: 0.25
    hard_limit_tolerance_rad: 0.0
    max_velocity_rad_s: 0.5
    max_source_velocity_rad_s: 3.0
    simulation_only: true
